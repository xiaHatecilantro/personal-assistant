name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: m10_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: agent_checkpoints
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent -d agent_checkpoints"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root:test-password@127.0.0.1:3306/m10_acceptance?charset=utf8mb4
      # 并发与迁移往返测试仅允许此显式测试库，不能复用生产 URL。
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://root:test-password@127.0.0.1:3306/m10_acceptance?charset=utf8mb4
      CHECKPOINT_DATABASE_URL: postgresql://agent:test-password@127.0.0.1:5432/agent_checkpoints
      JWT_SECRET_KEY: ci-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic evals
      - run: alembic upgrade head
      - run: pytest
      # Fake Model 只替代供应商决策，实际执行 Graph/审批/工具；不需要外部 API Key。
      - name: Agent evaluation gates
        run: python -m evals --seed 0 --output ../.run/agent-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-evaluation
          # 只上传明确指定的合成数据评测报告，不上传整个 .run 或环境文件。
          path: .run/agent-evaluation.json
          include-hidden-files: true
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm exec vitest run
      - run: npm run check
