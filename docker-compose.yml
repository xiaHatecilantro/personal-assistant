services:
  mysql:
    image: mysql:8.0
    container_name: pa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: personal_assistant
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-checkpoint-db:
    image: postgres:16-alpine
    container_name: pa-agent-checkpoint-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${CHECKPOINT_DB_PASSWORD:?Set CHECKPOINT_DB_PASSWORD in .env}
      POSTGRES_DB: agent_checkpoints
    volumes:
      - agent-checkpoint-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_checkpoints"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pa-backend
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD}@mysql:3306/personal_assistant?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FILE_ALLOWED_ROOTS: ${FILE_ALLOWED_ROOTS:-}
      LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-https://api.deepseek.com/v1,https://api.openai.com/v1}
      CHECKPOINT_DATABASE_URL: ${CHECKPOINT_DATABASE_URL:?Set CHECKPOINT_DATABASE_URL in .env}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-https://api.deepseek.com/v1}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-deepseek-chat}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-12}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-300}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
      agent-checkpoint-db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pa-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  agent-checkpoint-data:
