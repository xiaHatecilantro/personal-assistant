services:
  # MySQL 保存用户、任务、知识库及可查询的 Agent 审计数据。
  mysql:
    image: mysql:8.0
    container_name: pa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: personal_assistant
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PostgreSQL 专供 LangGraph Checkpoint，和 MySQL 业务数据分开演进。
  agent-checkpoint-db:
    image: postgres:16-alpine
    container_name: pa-agent-checkpoint-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${CHECKPOINT_DB_PASSWORD:?Set CHECKPOINT_DB_PASSWORD in .env}
      POSTGRES_DB: agent_checkpoints
    volumes:
      - agent-checkpoint-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_checkpoints"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 后端入口会在接收请求前执行 MySQL migration 和 Checkpoint 初始化。
  backend:
    build: ./backend
    container_name: pa-backend
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD}@mysql:3306/personal_assistant?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a strong JWT_SECRET_KEY in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FILE_ALLOWED_ROOTS: ${FILE_ALLOWED_ROOTS:-}
      LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-https://api.deepseek.com/v1,https://api.openai.com/v1}
      CHECKPOINT_DATABASE_URL: ${CHECKPOINT_DATABASE_URL:?Set CHECKPOINT_DATABASE_URL in .env}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-https://api.deepseek.com/v1}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-deepseek-chat}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-12}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-300}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
      agent-checkpoint-db:
        condition: service_healthy

  # 前端通过 Nginx 代理调用后端，因此只在后端健康后启动。
  frontend:
    build: ./frontend
    container_name: pa-frontend
    ports:
      - "80:80"
    # 静态入口探针只检查 Nginx；Agent 执行能力需单独按演示手册验证。
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  agent-checkpoint-data:
