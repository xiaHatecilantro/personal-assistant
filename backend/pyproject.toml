[tool.pytest.ini_options]
testpaths = ["tests"]
# console-script 和 python -m 两种入口都从后端根目录解析项目模块。
pythonpath = ["."]
addopts = "-q"
# 外部数据库等集成依赖必须显式配置，默认单元测试不隐式启动基础设施。
markers = [
    "integration: tests that require explicitly configured external infrastructure",
    "evaluation: deterministic Agent evaluation contracts and runner tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 聚焦语法错误、未定义名称和无效导入等高信噪比规则。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
